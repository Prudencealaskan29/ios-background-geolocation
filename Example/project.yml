# xcodegen spec for the BGeoExample console app.
# Regenerate the project after changing this file:  xcodegen generate
name: BGeoExample
options:
  deploymentTarget:
    iOS: "15.5"
  createIntermediateGroups: true
packages:
  BackgroundGeolocation:
    path: ../
targets:
  BGeoExample:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: BackgroundGeolocation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bgeo.example
        INFOPLIST_FILE: Sources/Info.plist
        # The blue map pin from `react-native/example/ios` — same artwork on
        # every console. `Sources/Images.xcassets` is picked up as a resource
        # by the `Sources` glob above; this names the icon set inside it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # No provisioning profile in this checkout; keep simulator builds
        # working without a signing team.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
  BGeoExampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: BGeoExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bgeo.example.tests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
schemes:
  BGeoExample:
    build:
      targets:
        BGeoExample: all
        BGeoExampleTests: [test]
    test:
      targets:
        - BGeoExampleTests
